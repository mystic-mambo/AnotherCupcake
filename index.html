<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUESTION.EXE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1a0e2e;
    --plum: #3a1f5c;
    --violet: #7b4ce0;
    --lav: #c9b6ff;
    --gold: #ffd166;
    --paper: #fbf6ff;
    --ink: #1f1435;
    --blush: #ff9ecb;
    --pixel: "Press Start 2P", "Courier New", monospace;
    --mono: "VT323", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 20% 20%, rgba(123, 76, 224, 0.35), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(255, 158, 203, 0.18), transparent 55%),
      var(--night);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 22px;
    line-height: 1.3;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5vh 5vw;
  }
  .page {
    width: min(560px, 100%);
    max-height: 88vh;
    overflow: auto;
  }
  .frame {
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--violet);
    box-shadow: 7px 7px 0 rgba(0, 0, 0, 0.5);
  }
  .tb {
    padding: 8px 12px;
    background: linear-gradient(90deg, var(--plum), var(--violet));
    color: #fff;
    font-family: var(--pixel);
    font-size: 11px;
  }
  .body { padding: 22px 22px 24px; text-align: center; }
  .body p { margin: 0 0 14px; font-size: 24px; }
  .btn {
    padding: 9px 18px;
    background: var(--violet);
    color: #fff;
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    font-size: 22px;
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.gold { background: var(--gold); color: var(--ink); }
  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }

  #dots {
    position: fixed;
    left: 50%;
    bottom: 5vh;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  #dots span {
    width: 9px;
    height: 9px;
    background: rgba(255, 255, 255, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.4);
  }
  #dots span.on { background: var(--gold); border-color: var(--gold); }

  /* boot */
  #bootLog { min-height: 7em; white-space: pre-wrap; color: var(--lav); font-size: 22px; }
  .meter { max-width: 460px; height: 22px; margin: 14px auto 0; padding: 2px; border: 3px solid var(--lav); }
  .meter > i { display: block; width: 0; height: 100%; background: var(--blush); transition: width 0.4s steps(8); }

  /* quiz */
  .opt {
    display: block;
    width: 100%;
    margin: 8px 0;
    text-align: left;
    padding: 10px 14px;
  }

  /* loading page */
  .row { margin: 16px 0; text-align: left; }
  .row .lbl { display: flex; justify-content: space-between; font-size: 20px; color: var(--plum); }
  .track { height: 18px; margin-top: 4px; padding: 2px; border: 3px solid var(--ink); background: #fff; }
  .track > i { display: block; width: 0; height: 100%; background: var(--violet); transition: width 0.6s steps(10); }

  /* confession */
  #letterText { white-space: pre-wrap; font-size: 24px; text-align: left; margin: 0 0 18px; }
  .caret::after { content: "\258C"; color: var(--violet); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #ask { font-family: var(--pixel); font-size: 15px; margin: 18px 0 16px; color: var(--plum); }
  #choices { position: relative; height: 64px; }
  #yesBtn { position: relative; z-index: 2; }
  #noBtn { position: absolute; top: 0; left: calc(50% + 70px); transition: left 0.18s ease, top 0.18s ease; }

  #celebrate {
    text-align: center;
  }
  #celebrate .big { font-size: 44px; margin-bottom: 10px; }

  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .bit {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 14px;
    opacity: 0.9;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(320deg); opacity: 0.3; }
  }

  @media (max-width: 480px) {
    body { font-size: 20px; }
    .body p { font-size: 22px; }
    #noBtn { left: auto; right: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .meter > i, .track > i { transition: none; }
    .caret::after { animation: none; }
    .bit { animation: none; opacity: 0; }
  }
</style>
</head>
<body>

<div id="confetti" aria-hidden="true"></div>

<div id="stage">

  <!-- 0: boot -->
  <section class="page frame" id="p-boot">
    <div class="tb" id="winTitle"></div>
    <div class="body">
      <div id="bootLog" aria-live="polite"></div>
      <div class="meter" aria-hidden="true"><i id="bootFill"></i></div>
    </div>
  </section>

  <!-- 1: welcome -->
  <section class="page frame" id="p-welcome" hidden>
    <div class="tb"><span id="wt1"></span></div>
    <div class="body">
      <p id="welcomeText"></p>
      <div class="btns"><button class="btn gold" data-next>Start</button></div>
    </div>
  </section>

  <!-- 2: quiz -->
  <section class="page frame" id="p-quiz" hidden>
    <div class="tb"><span>quiz.exe</span></div>
    <div class="body">
      <p id="quizQ"></p>
      <div id="quizOpts"></div>
    </div>
  </section>

  <!-- 3: quiz result -->
  <section class="page frame" id="p-result" hidden>
    <div class="tb"><span>result.txt</span></div>
    <div class="body">
      <p id="resultText"></p>
      <div class="btns"><button class="btn gold" data-next>Continue</button></div>
    </div>
  </section>

  <!-- 4: loading -->
  <section class="page frame" id="p-loading" hidden>
    <div class="tb"><span>loading.exe</span></div>
    <div class="body">
      <p>Running final checks...</p>
      <div id="loadList"></div>
      <div class="btns" id="loadContinue" hidden><button class="btn gold" data-next>Continue</button></div>
    </div>
  </section>

  <!-- 5: confession -->
  <section class="page frame" id="p-confess" hidden>
    <div class="tb"><span>the_question.exe</span></div>
    <div class="body">
      <p id="letterText"></p>
      <p id="ask" hidden></p>
      <div id="choices" hidden>
        <button class="btn gold" id="yesBtn">Yes 💜</button>
        <button class="btn" id="noBtn">No</button>
      </div>
    </div>
  </section>

  <!-- 6: celebrate -->
  <section class="page frame" id="p-celebrate" hidden>
    <div class="tb"><span>success.exe</span></div>
    <div class="body" id="celebrate">
      <div class="big">🎉💜🎉</div>
      <p id="celebrateText"></p>
    </div>
  </section>

</div>

<div id="dots" aria-hidden="true"></div>

<script>
/* ==========================================================
   EDIT THIS BLOCK: everything the page says lives here.
   Swap the placeholder lines for your own. Keep the quote
   marks and commas.
   ========================================================== */
const CONFIG = {
  title: "QUESTION.EXE",
  to: "Cupcake",
  from: "Mambo",

  welcomeTitle: "hey.exe",
  welcomeText: "Hey Cupcake. Before anything else... I made you a little game. Ready?",

  // A silly multiple choice question. correctIndex picks which option is "right" (0-based).
  quiz: {
    question: "Quick question: on a scale of 1 to 10, how much do I annoy you?",
    options: ["1, you're actually great", "10, constantly", "There's no scale big enough", "Depends on the day"],
    correctIndex: 0,
    correctText: "Wrong answer accepted. Moving on anyway. 😄",
    wrongText: "Also wrong, but I'll allow it. Moving on. 😄"
  },

  // Progress bars before the confession. Purely for fun.
  loading: [
    "Loading courage",
    "Double checking this is a good idea",
    "Definitely not backing out now",
    "Preparing the question"
  ],

  // The confession letter, one line per paragraph.
  letter: [
    "Okay, real talk for a second.",
    "I've liked you for a while now, and I kept putting off saying it because I didn't want to mess things up.",
    "But I don't want to keep wondering \"what if\", so here it is.",
    "You make me laugh, you're easy to talk to, and honestly, you're just really easy to like."
  ],

  question: "Can I Be Your.... Boyfriend?",

  // Shown after she clicks Yes.
  celebrate: "You said yes. I'm genuinely so happy right now. 💜"
};

/* ==========================================================
   Below here you don't need to change anything.
   ========================================================== */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

document.title = CONFIG.title;
$("#winTitle").textContent = CONFIG.title;
$("#wt1").textContent = CONFIG.welcomeTitle;
$("#welcomeText").textContent = CONFIG.welcomeText.replace("Cupcake", CONFIG.to);
$("#quizQ").textContent = CONFIG.quiz.question;
$("#ask").textContent = CONFIG.question;
$("#celebrateText").textContent = CONFIG.celebrate;

CONFIG.quiz.options.forEach((text, i) => {
  const b = document.createElement("button");
  b.className = "btn opt";
  b.textContent = text;
  b.addEventListener("click", () => chooseQuiz(i));
  $("#quizOpts").appendChild(b);
});

CONFIG.loading.forEach(text => {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<div class="lbl"><span></span><span class="pct">0%</span></div><div class="track"><i></i></div>';
  $(".lbl span", row).textContent = text;
  $("#loadList").appendChild(row);
});

/* ---------- page flow ---------- */
const order = ["p-boot", "p-welcome", "p-quiz", "p-result", "p-loading", "p-confess", "p-celebrate"];
const dotsWrap = $("#dots");
order.slice(1, -1).forEach(() => {
  const d = document.createElement("span");
  dotsWrap.appendChild(d);
});

function show(id) {
  order.forEach(pid => { $("#" + pid).hidden = pid !== id; });
  const idx = order.indexOf(id) - 1;
  $$("#dots span").forEach((d, i) => d.classList.toggle("on", i === idx));
  dotsWrap.hidden = id === "p-boot" || id === "p-celebrate";
  const run = pageInit[id];
  if (run && !$("#" + id).dataset.done) {
    $("#" + id).dataset.done = "1";
    run();
  }
}

$$("[data-next]").forEach(btn => btn.addEventListener("click", () => {
  const cur = btn.closest(".page").id;
  show(order[order.indexOf(cur) + 1]);
}));

/* ---------- boot ---------- */
async function bootSeq() {
  const lines = [
    `${CONFIG.title} v1.0`,
    "loading nerve...... ok",
    `locating ${CONFIG.to}...... found`,
    "preparing question...... ok"
  ];
  const log = $("#bootLog");
  const fill = $("#bootFill");
  for (let i = 0; i < lines.length; i++) {
    log.textContent += lines[i] + "\n";
    fill.style.width = ((i + 1) / lines.length * 100) + "%";
    await sleep(600);
  }
  await sleep(400);
  show("p-welcome");
}

/* ---------- quiz ---------- */
function chooseQuiz(i) {
  const q = CONFIG.quiz;
  $("#resultText").textContent = i === q.correctIndex ? q.correctText : q.wrongText;
  show("p-result");
}

/* ---------- loading bars ---------- */
async function loadingSeq() {
  for (const row of $$(".row", $("#p-loading"))) {
    await sleep(200);
    $("i", row).style.width = "100%";
    $(".pct", row).textContent = "100%";
    await sleep(500);
  }
  await sleep(300);
  $("#loadContinue").hidden = false;
}

/* ---------- confession letter ---------- */
async function confessSeq() {
  const el = $("#letterText");
  const chars = Array.from(CONFIG.letter.join("\n\n"));
  let skipTyping = false;
  $("#p-confess").addEventListener("click", () => { skipTyping = true; }, { once: true });
  el.classList.add("caret");
  let out = "";
  for (const c of chars) {
    if (skipTyping || reduce) break;
    out += c;
    el.textContent = out;
    await new Promise(r => setTimeout(r, c === "\n" ? 170 : 24));
  }
  el.textContent = chars.join("");
  el.classList.remove("caret");
  await sleep(400);
  $("#ask").hidden = false;
  $("#choices").hidden = false;
}

/* ---------- yes / no ---------- */
$("#yesBtn").addEventListener("click", () => {
  show("p-celebrate");
  if (!reduce) burstConfetti();
});

const noBtn = $("#noBtn");
function dodgeNo() {
  const wrap = $("#choices").getBoundingClientRect();
  const maxX = Math.max(0, wrap.width - noBtn.offsetWidth - 8);
  const maxY = Math.max(0, wrap.height - noBtn.offsetHeight - 8);
  noBtn.style.left = (Math.random() * maxX) + "px";
  noBtn.style.top = (Math.random() * maxY) + "px";
}
["pointerenter", "focus"].forEach(evt => noBtn.addEventListener(evt, dodgeNo));
noBtn.addEventListener("click", dodgeNo);

/* ---------- confetti ---------- */
function burstConfetti() {
  const colors = ["#7b4ce0", "#ff9ecb", "#ffd166", "#c9b6ff"];
  const box = $("#confetti");
  for (let i = 0; i < 60; i++) {
    const b = document.createElement("i");
    b.className = "bit";
    b.style.left = Math.random() * 100 + "vw";
    b.style.background = colors[i % colors.length];
    b.style.animationDuration = (2.2 + Math.random() * 1.6) + "s";
    b.style.animationDelay = (Math.random() * 0.6) + "s";
    box.appendChild(b);
    setTimeout(() => b.remove(), 4500);
  }
}

const pageInit = {
  "p-boot": bootSeq,
  "p-loading": loadingSeq,
  "p-confess": confessSeq
};

show("p-boot");
</script>
</body>
</html>
